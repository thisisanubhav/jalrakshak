name: Software MVP checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/unified-field-experience]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-server:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: compose.yaml:compose.ai.yaml
      COMPOSE_PROJECT_NAME: jalrakshak-https-ci
      JALRAKSHAK_DOMAIN: localhost
      JALRAKSHAK_PUBLIC_ORIGIN: https://localhost:3443
      JALRAKSHAK_HTTP_BIND: 127.0.0.1:3080
      JALRAKSHAK_HTTPS_BIND: 127.0.0.1:3443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate and build isolated shared server
        run: |
          docker compose config --quiet
          docker compose build app whisper ollama
          docker compose run --rm ollama-pull
          docker compose run --rm whisper-download
          docker compose up -d --wait --wait-timeout 180
      - name: Trust only the test proxy CA for this test process
        run: |
          for attempt in $(seq 1 30); do
            if docker compose cp https:/data/caddy/pki/authorities/local/root.crt /tmp/jalrakshak-ci-root.crt; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify HTTPS sessions, permissions, durable records and restored backups
        env:
          NODE_EXTRA_CA_CERTS: /tmp/jalrakshak-ci-root.crt
        run: node scripts/shared-server-smoke.mjs
      - name: Verify AI isolation, multiple workers, outages, restarts and full restore
        env:
          NODE_EXTRA_CA_CERTS: /tmp/jalrakshak-ci-root.crt
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          espeak-ng -w /tmp/jalrakshak-ai-test.wav 'The pump platform is cracked. Please inspect the drainage.'
          ffmpeg -loglevel error -i /tmp/jalrakshak-ai-test.wav -ar 16000 -ac 1 -f s16le /tmp/jalrakshak-ai-test.pcm
          node scripts/ai-container-smoke.mjs
      - name: Diagnose container failure
        if: failure()
        run: docker compose ps -a
      - name: Remove isolated test containers and volumes
        if: always()
        run: docker compose down --volumes
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Allow Playwright Chromium sandbox on Ubuntu
        # Ubuntu's AppArmor userns restriction otherwise prevents Chromium startup.
        # Scope the allowance to Playwright's headless shell; keep its sandbox on.
        run: |
          sudo tee /etc/apparmor.d/playwright-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile playwright-chromium "$HOME/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/playwright-chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run sandboxed release browser suite (zero retries)
        id: browser
        run: npx playwright test --config=playwright.release.config.ts
      - name: Summarize and validate browser execution
        if: ${{ !cancelled() && steps.browser.outcome != 'skipped' }}
        run: node scripts/check-browser-results.mjs
      - name: Upload browser reports and evidence
        if: ${{ !cancelled() && steps.browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            !test-results/*.sqlite*
          if-no-files-found: error
          retention-days: 14
