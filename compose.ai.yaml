# Add with: docker compose -f compose.yaml -f compose.ai.yaml ...
services:
  app:
    environment:
      JALRAKSHAK_OLLAMA_URL: http://ollama:11434
      JALRAKSHAK_WHISPER_URL: http://whisper:8178
      JALRAKSHAK_AI_MODEL: qwen2.5:1.5b
      TZ: ${JALRAKSHAK_TIMEZONE:-Asia/Kolkata}
    networks: [default, ai]
  ollama:
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    init: true
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_DEBUG_LOG_REQUESTS: 'false'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_KEEP_ALIVE: 5m
    volumes: [ollama_models:/root/.ollama]
    networks: [ai]
    mem_limit: 3g
    cpus: 2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, ollama, show, 'qwen2.5:1.5b']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  whisper:
    build:
      context: .
      dockerfile: deploy/speech.Dockerfile
    image: jalrakshak-speech:${JALRAKSHAK_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      JALRAKSHAK_WHISPER_MODEL: /models/whisper
      JALRAKSHAK_WHISPER_HOST: 0.0.0.0
      HF_HUB_OFFLINE: '1'
    volumes: [speech_models:/models:ro]
    networks: [ai]
    mem_limit: 2g
    cpus: 2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:size=64m]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8178/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
  # Explicit setup jobs alone have internet access to download model weights.
  ollama-pull:
    image: ollama/ollama:0.40.10
    profiles: [ai-setup]
    environment:
      OLLAMA_NO_CLOUD: '1'
    volumes: [ollama_models:/root/.ollama]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        ollama serve &
        server=$$!
        trap 'kill $$server; wait $$server || true' EXIT
        attempt=0
        until ollama list >/dev/null 2>&1; do
          attempt=$$((attempt+1))
          if [ "$$attempt" -gt 30 ]; then exit 1; fi
          sleep 1
        done
        ollama pull qwen2.5:1.5b
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  whisper-download:
    image: jalrakshak-speech:${JALRAKSHAK_IMAGE_TAG:-local}
    profiles: [ai-setup]
    volumes: [speech_models:/models]
    entrypoint: [python, -c]
    command:
      - "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small', revision='536b0662742c02347bc0e980a01041f333bce120', local_dir='/models/whisper')"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  ollama_models:
  speech_models:
networks:
  ai:
    internal: true
